[project]
name = "peoples-gas-lib"
version = "0.1.0"
description = "Peoples Gas web client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.14.0", "beautifulsoup4>=4.12.0"]

[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"

[dependency-groups]
nox = ["nox", "nox-uv"]
test = [
  "pytest",
  "pytest-asyncio",
  "pytest-recording",
  "pytest-cov",
  "fest-mutate",
]
typecheck = ["ty"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
addopts = ["--cov=peoples_gas_lib", "--cov-context=test"]

[tool.coverage.report]
fail_under = 80
show_missing = true
